name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-2022
          - os: ubuntu-22.04
          - os: ubuntu-22.04-arm
            arch: arm64
          - os: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/checkout@v6
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf libssl-dev rpm flatpak flatpak-builder elfutils xdg-utils \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev || sudo apt-get install -y libsoup2.4-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Prepare Tauri signing key
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY Secret 缺失" >&2
            exit 1
          fi
          RAW="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          KEY_PATH="$RUNNER_TEMP/tauri_signing.key"
          if echo "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
            FIXED_RAW=$(echo "$RAW" | sed 's/^untrusted comment: rsign encrypted secret key/untrusted comment: tauri sign key/')
            printf '%s\n' "$FIXED_RAW" > "$KEY_PATH"
          elif DECODED=$(printf '%s' "$RAW" | (base64 --decode 2>/dev/null || base64 -D)) && echo "$DECODED" | grep '^untrusted comment:'; then
            FIXED_DEC=$(echo "$DECODED" | sed 's/^untrusted comment: rsign encrypted secret key/untrusted comment: tauri sign key/')
            printf '%s\n' "$FIXED_DEC" > "$KEY_PATH"
          elif echo "$RAW" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            ONE=$(printf '%s' "$RAW" | tr -d '\r\n')
            printf '%s\n%s\n' "untrusted comment: tauri sign key" "$ONE" > "$KEY_PATH"
          else
            echo "❌ 私钥格式非法" >&2
            exit 1
          fi
          if command -v base64 >/dev/null; then
            KEY_B64=$(base64 < "$KEY_PATH" | tr -d '\r\n')
          elif command -v openssl >/dev/null; then
            KEY_B64=$(openssl base64 -A -in "$KEY_PATH")
          else
            KEY_B64=$(KEY_PATH="$KEY_PATH" node -e "process.stdout.write(require('fs').readFileSync(process.env.KEY_PATH).toString('base64'))")
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Build Tauri App (macOS 免签打包，修复参数报错)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          # 心跳保活，防止长时间无输出被runner终止
          while true; do echo "⏳ macOS 打包心跳 $(date)"; sleep 30; done &
          HEART_PID=$!

          max_attempts=3
          echo "🔨 免签模式打包macOS，跳过staple公证，不使用苹果开发者证书"

          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== macOS 打包尝试 ${attempt}/${max_attempts} ==="
            # 关键修复：-- 分隔pnpm脚本参数与tauri底层参数，使用官方兼容参数 --skip-stapling
            if pnpm run tauri build --target universal-apple-darwin -- --skip-stapling; then
              echo "✅ macOS 打包完成（免签模式）"
              kill $HEART_PID || true
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "❌ macOS 打包失败" >&2
              kill $HEART_PID || true
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "⚠️ macOS 打包失败，${sleep_seconds}秒后重试..."
            sleep "$sleep_seconds"
          done

      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        run: pnpm tauri build

      - name: Build Tauri App (Linux)
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles appimage,deb,rpm

      - name: Prepare macOS Assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"
          TAR_GZ=""; APP_PATH=""
          for path in src-tauri/target/universal-apple-darwin/release/bundle/macos src-tauri/target/aarch64-apple-darwin/release/bundle/macos src-tauri/target/x86_64-apple-darwin/release/bundle/macos src-tauri/target/release/bundle/macos; do
            [ -d "$path" ] && [ -z "$TAR_GZ" ] && TAR_GZ=$(find "$path" -maxdepth 1 -name "*.tar.gz" | head -1)
            [ -d "$path" ] && [ -z "$APP_PATH" ] && APP_PATH=$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1)
          done
          [ -z "$TAR_GZ" ] && echo "❌ 未找到macOS更新包tar.gz" >&2 && exit 1
          [ -z "$APP_PATH" ] && echo "❌ 未找到.app程序" >&2 && exit 1

          # 免签打包，跳过 stapler 公证装订
          # 无需执行 xcrun stapler staple

          # 1) 复制自动更新tar包
          NEW_TAR_GZ="CC-Switch-${VERSION}-macOS.tar.gz"
          cp "$TAR_GZ" release-assets/$NEW_TAR_GZ
          [ -f "$TAR_GZ.sig" ] && cp "$TAR_GZ.sig" release-assets/$NEW_TAR_GZ.sig
          echo "macOS updater archive copied: $NEW_TAR_GZ"

          # 2) 打包.app为zip
          NEW_ZIP="CC-Switch-${VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" release-assets/$NEW_ZIP
          echo "macOS zip archive ready: $NEW_ZIP"

          # 3) 构建无签名DMG，移除--codesign参数
          BG_IMG="src-tauri/icons/dmg-background.png"
          if [ -f "$BG_IMG" ]; then BG_ARG="--background $BG_IMG"; else unset BG_ARG; fi
          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          NEW_DMG="CC-Switch-${VERSION}-macOS.dmg"
          DMG_STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf $DMG_STAGE && mkdir -p $DMG_STAGE
          ditto "$APP_PATH" "$DMG_STAGE/CC Switch.app"

          create-dmg \
            --volname "CC Switch" $BG_ARG \
            --window-size 660 400 --window-pos 200 120 \
            --icon-size 80 --icon "CC Switch.app" 180 220 \
            --hide-extension "CC Switch.app" \
            --app-drop-link 480 220 \
            --no-internet-enable \
            release-assets/$NEW_DMG $DMG_STAGE
          rm -rf $DMG_STAGE
          echo "✅ Un-signed DMG created: $NEW_DMG"

      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $VER = $env:GITHUB_REF_NAME
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi -Recurse *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { $msi = Get-ChildItem src-tauri/target/release/bundle -Recurse *.msi | Select-Object -First 1 }
          if ($msi) {
            $dest = "CC-Switch-$VER-Windows.msi"
            Copy-Item $msi.FullName release-assets/$dest
            $sig = "$($msi.FullName).sig"
            if (Test-Path $sig) { Copy-Item $sig release-assets/$dest.sig }
          }
          $exe = @('src-tauri/target/release/cc-switch.exe','src-tauri/target/x86_64-pc-windows-msvc/release/cc-switch.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($exe) {
            $portDir = 'release-assets/CC-Switch-Portable'
            New-Item -ItemType Directory -Force $portDir | Out-Null
            Copy-Item $exe $portDir
            '# portable=true' | Out-File "$portDir/portable.ini" -Encoding utf8
            Compress-Archive "$portDir/*" "release-assets/CC-Switch-$VER-Windows-Portable.zip" -Force
            Remove-Item -Recurse -Force $portDir
          }

      - name: Prepare Linux Assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VER="${GITHUB_REF_NAME}"
          ARCH="${{ matrix.arch || 'x86_64' }}"
          APP=$(find src-tauri/target/release/bundle -name "*.AppImage" | head -1)
          if [ -n "$APP" ]; then
            cp "$APP" "release-assets/CC-Switch-${VER}-Linux-${ARCH}.AppImage"
            [ -f "$APP.sig" ] && cp "$APP.sig" "release-assets/CC-Switch-${VER}-Linux-${ARCH}.AppImage.sig"
          fi
          DEB=$(find src-tauri/target/release/bundle -name "*.deb" | head -1)
          [ -n "$DEB" ] && cp "$DEB" "release-assets/CC-Switch-${VER}-Linux-${ARCH}.deb"
          RPM=$(find src-tauri/target/release/bundle -name "*.rpm" | head -1)
          [ -n "$RPM" ] && cp "$RPM" "release-assets/CC-Switch-${VER}-Linux-${ARCH}.rpm"

      - name: List built assets
        shell: bash
        run: ls -la release-assets || true

      - name: Collect update signatures
        shell: bash
        run: |
          set -euo pipefail
          echo "Generated update signature files:"
          ls -la release-assets/*.sig 2>/dev/null || echo "No signature files found"

      - name: Upload release artifacts to workflow storage
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch || runner.arch }}
          path: release-assets/*
          if-no-files-found: error

      - name: List compiled build bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "Searching compiled target files..."
          find src-tauri/target -maxdepth 4 -type f 2>/dev/null || echo "No target files found"

  publish-release:
    name: Publish GitHub Release Page
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Show all release files
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-assets

      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: CC Switch ${{ github.ref_name }}
          prerelease: true
          body: |
            ## CC Switch ${{ github.ref_name }}
            🌐 唯一官方网站：[ccswitch.io](https://ccswitch.io)
            Claude Code 多模型供应商切换工具

            ### 各平台下载包
            - macOS：`CC-Switch-${{ github.ref_name }}-macOS.dmg`（未签名免公证，首次打开右键-绕过安全拦截）
            - Windows：MSI安装包 / 绿色便携ZIP
            - Linux x86_64 / ARM64：AppImage / deb / rpm

            > `.tar.gz` 文件为程序自动更新专用包，无需手动下载安装
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assemble-latest-json:
    name: Generate auto-update latest.json
    needs: publish-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Install GitHub CLI gh
        run: sudo apt update && sudo apt install -y gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all release assets
        run: |
          mkdir -p dl
          gh release download $GITHUB_REF_NAME --dir dl
      - name: Generate latest.json update manifest
        run: |
          set -euo pipefail
          VER=${GITHUB_REF_NAME#v}
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          URL_BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          mac_url="" mac_sig="" win_url="" win_sig="" linux_x64="" linux_x64_sig="" linux_arm64="" linux_arm64_sig=""
          shopt -s nullglob
          for sig in dl/*.sig; do
            base=${sig%.sig}
            fname=$(basename $base)
            sig_txt=$(cat $sig)
            case $fname in
              *.tar.gz) mac_url="$URL_BASE/$fname"; mac_sig="$sig_txt" ;;
              *Linux-x86_64*.AppImage) linux_x64="$URL_BASE/$fname"; linux_x64_sig="$sig_txt" ;;
              *Linux-arm64*.AppImage) linux_arm64="$URL_BASE/$fname"; linux_arm64_sig="$sig_txt" ;;
              *.msi) win_url="$URL_BASE/$fname"; win_sig="$sig_txt" ;;
            esac
          done
          cat > latest.json <<JSON
          {
            "version": "$VER",
            "notes": "Release $GITHUB_REF_NAME",
            "pub_date": "$DATE",
            "platforms": {
              $(if [ -n "$mac_url" ]; then echo '"darwin-aarch64":{"url":"'$mac_url'","signature":"'$mac_sig'"}, "darwin-x86_64":{"url":"'$mac_url'","signature":"'$mac_sig'"},'; fi)
              $(if [ -n "$win_url" ]; then echo '"windows-x86_64":{"url":"'$win_url'","signature":"'$win_sig'"},'; fi)
              $(if [ -n "$linux_x64" ]; then echo '"linux-x86_64":{"url":"'$linux_x64'","signature":"'$linux_x64_sig'"},'; fi)
              $(if [ -n "$linux_arm64" ]; then echo '"linux-aarch64":{"url":"'$linux_arm64'","signature":"'$linux_arm64_sig'"}'; fi)
            }
          }
          JSON
          cat latest.json
      - name: Upload latest.json to release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $GITHUB_REF_NAME latest.json --clobber